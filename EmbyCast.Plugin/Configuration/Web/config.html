<div is="emby-scroller"
     class="view flex flex-direction-column scrollFrameY flex-grow"
     data-horizontal="false"
     data-forcescrollbar="true"
     data-centerfocus="true"
     data-bindheader="true"
     data-controller="__plugin/embycastconfig"
     data-title="EmbyCast">
  <!--
    EmbyCast dashboard SHELL - keep this file (and config.js) as stable as possible.

    Emby serves plugin pages under a URL that only carries the *Emby server* version
    (configurationpage?name=...&v=<server version>) with a content-independent ETag, so after a
    plugin update browsers keep running their cached copy until the cache is cleared by hand.
    This shell therefore contains no dashboard markup: config.js loads the real page
    (app.html + app.js) from EmbyCast's own per-version URLs, which are always fetched fresh.
    Changes to this file or config.js only reach browsers after a manual cache clear - bump
    SHELL_VERSION (config.js) and PluginVersionDto.ShellVersion (EmbyCastApi.cs) together when
    changing them, so outdated shells show a "please clear your cache" notice.
  -->
  <div class="scrollSlider flex-grow flex-direction-column padded-left padded-left-page padded-right padded-top-page padded-bottom-page">
    <div class="embycast-shell-status" style="opacity:.6;padding:1em 0;">Loading EmbyCast…</div>
  </div>
</div>
